[package]
name = "protein"
version = "0.1.0"
edition = "2021"
description = "Terminal UI to build, launch, track and kill macOS caffeinate sessions"
license = "MIT"
readme = "README.md"

[[bin]]
name = "caf"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
dirs = "5.0"
nix = { version = "0.28", features = ["signal"] }
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "process", "time", "sync"] }
uuid = { version = "1.7", features = ["v4", "serde"] }

[profile.release]
lto = true
strip = true
